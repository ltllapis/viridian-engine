<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viridian Studio</title>
<link rel="stylesheet" href="studio.css">
</head><body>
<div id="top">
  <h1><b>Viridian</b> Studio<small id="ver"></small></h1>
  <label>Day <select id="daySel"></select></label>
  <label>Scene file <select id="sceneSel"></select></label>
  <span class="sp"></span>
  <span id="flash"></span><span id="unsaved"></span>
  <button id="handoff" title="Collect your changes and notes to paste into the chat">Send to Claude</button>
  <span id="conn"><i></i><span>connecting</span></span>
</div>
<div id="strip" class="idle"><span class="dot"></span>
  <div id="st-main"><div id="st-task">Nothing in progress</div><div id="st-detail">The strip fills in while a build is running.</div></div>
  <div id="st-steps"></div><div id="st-age"></div></div>
<div id="main">
  <div id="stage"><div id="phone"><iframe id="f" class="live" title="scene"></iframe><iframe id="f2" title="scene (loading)" aria-hidden="true"></iframe>
    <div id="guides"><div class="z" style="top:0;height:13%"><span>app bar</span></div><div class="z" style="top:81.8%;bottom:0"><span>app buttons</span></div></div></div>
    <div id="hud"></div><div id="draftTag">Showing unsaved changes</div><div id="msg"></div></div>
  <div id="side"><div id="tabs" role="tablist"></div><div id="panel"></div></div>
</div>
<div id="dock">
  <div id="bar">
    <button id="play" class="primary">Play</button><button id="back">-1s</button><button id="fwd">+1s</button>
    <button id="prev" title="Previous scene">|◂ Scene</button><button id="next" title="Next scene">Scene ▸|</button>
    <button id="sg">Safe zone</button><button id="cap" class="on">Captions</button>
    <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option></select></label>
    <span id="time">0.0 / 0.0 s</span><span class="sp"></span>
    <span class="hint" style="font-size:12px"><kbd>Space</kbd> play <kbd>←</kbd><kbd>→</kbd> 1 s <kbd>[</kbd><kbd>]</kbd> scene <kbd>N</kbd> note <kbd>Ctrl</kbd>+<kbd>S</kbd> save</span>
  </div>
  <div id="tl"><canvas id="wave"></canvas><div id="blocks"></div><div id="marks"></div><div id="head"></div></div>
  <div id="ticks"></div>
</div>
<dialog id="dlg"></dialog><div id="toast"></div>
<audio id="a" preload="auto"></audio><audio id="m" preload="auto"></audio><audio id="x" preload="auto"></audio>
<script type="module" src="js/main.js"></script>
</body></html>
