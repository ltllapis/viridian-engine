<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#F4ECDF;font-family:Montserrat,sans-serif}
svg{position:absolute;left:0;top:0}
#cap{position:absolute;left:0;right:0;top:688px;text-align:center;font-weight:800;font-size:23px;white-space:nowrap;display:none}
#cap span{display:inline-block;margin:0 3.5px;color:#C9BFAF}
#cap span.done{color:#3E4A63}
#cap span.on{color:#E07A6B}
body.captions #cap{display:block}
</style></head>
<body>
<svg id="stage" width="540" height="960" viewBox="35 50 470 835"></svg>
<div id="cap"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const prog=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;

// palette
const P={cream:'#F4ECDF',cream2:'#EADFCD',cream3:'#E2D5C0',ink:'#3E4A63',ink2:'#5B6782',mint:'#8FD3B6',mint2:'#5FB894',coral:'#F19C8E',coral2:'#E07A6B',
  butter:'#F6D186',butter2:'#E9B65A',sky:'#A7C7EA',sky2:'#7FA8D8',lav:'#C3B3E6',lav2:'#9E8AD3',peach:'#F7C3A0',white:'#FFFDF8'};

let S,T,SC=[];
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
function svgEl(html){const g=document.createElementNS(NS,'g');g.innerHTML=html;stage.appendChild(g);return g;}
const q=(root,sel)=>root.querySelector(sel);
const tf=(e,x,y,s=1,r=0)=>e&&e.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);
function wordTime(sc,key){if(!key)return sc.t0+.3;const w=sc.words.find(w=>w.w.replace(/[^\w&]/g,'').toLowerCase().startsWith(key.toLowerCase()));return w?w.t0:sc.t0+.3;}

// ---------- shape library (centred at 0,0) ----------
const shadow=(w,y=0)=>`<ellipse cx="0" cy="${y}" rx="${w}" ry="${w*0.12}" fill="${P.cream3}"/>`;
const building=(c=P.sky,c2=P.sky2)=>`<g>
  <rect x="-110" y="40" width="220" height="22" rx="4" fill="${c2}"/>
  <rect x="-96" y="22" width="192" height="18" rx="3" fill="${c}"/>
  ${[-72,-36,0,36,72].map(x=>`<rect x="${x-11}" y="-78" width="22" height="100" rx="3" fill="${P.white}"/>`).join('')}
  <rect x="-100" y="-96" width="200" height="18" rx="3" fill="${c}"/>
  <path d="M-110 -96 L0 -150 L110 -96 Z" fill="${c2}"/>
  <circle cx="0" cy="-118" r="9" fill="${P.white}"/></g>`;
const apple=(c=P.coral,c2=P.coral2)=>`<g><path d="M0 -28 C-18 -44 -54 -38 -54 0 C-54 34 -26 58 -12 54 C-6 52 6 52 12 54 C26 58 54 34 54 0 C54 -38 18 -44 0 -28 Z" fill="${c}"/>
  <path d="M-30 -10 C-34 6 -28 22 -20 30" stroke="${P.white}" stroke-width="7" stroke-linecap="round" fill="none" opacity=".55"/>
  <rect x="-3" y="-52" width="6" height="22" rx="3" fill="${P.ink2}"/><path d="M4 -42 C14 -62 34 -60 38 -54 C30 -42 14 -38 4 -42 Z" fill="${P.mint2}"/></g>`;
const chip=(c=P.butter,c2=P.butter2,s=1)=>`<g transform="scale(${s})">${[-36,-12,12,36].map(v=>`<rect x="${v-5}" y="-86" width="10" height="24" rx="4" fill="${c2}"/><rect x="${v-5}" y="62" width="10" height="24" rx="4" fill="${c2}"/><rect x="-86" y="${v-5}" width="24" height="10" rx="4" fill="${c2}"/><rect x="62" y="${v-5}" width="24" height="10" rx="4" fill="${c2}"/>`).join('')}
  <rect x="-66" y="-66" width="132" height="132" rx="18" fill="${c}"/><rect x="-34" y="-34" width="68" height="68" rx="10" fill="${P.white}"/><rect x="-18" y="-18" width="36" height="36" rx="6" fill="${c2}"/></g>`;
const arrow=(c,up=true)=>`<g transform="rotate(${up?0:180})"><path d="M0 -34 L28 0 L12 0 L12 30 L-12 30 L-12 0 L-28 0 Z" fill="${c}"/></g>`;
const ballotBox=()=>`<g><rect x="-80" y="-20" width="160" height="110" rx="12" fill="${P.sky}"/><rect x="-80" y="-20" width="160" height="26" rx="10" fill="${P.sky2}"/>
  <rect x="-44" y="-12" width="88" height="10" rx="5" fill="${P.ink}"/><rect x="-26" y="30" width="52" height="34" rx="8" fill="${P.white}" opacity=".7"/></g>`;
const ballot=()=>`<g><rect x="-34" y="-46" width="68" height="84" rx="6" fill="${P.white}"/><path d="M-16 -4 L-4 8 L18 -18" stroke="${P.mint2}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-20" y="18" width="40" height="6" rx="3" fill="${P.cream3}"/></g>`;
const gpu=()=>`<g><rect x="-120" y="-52" width="240" height="104" rx="16" fill="${P.lav}"/><rect x="-120" y="40" width="240" height="12" rx="6" fill="${P.lav2}"/>
  ${[-55,55].map(x=>`<g transform="translate(${x} -4)"><circle r="38" fill="${P.lav2}"/><g class="fan">${[0,72,144,216,288].map(a=>`<path d="M0 0 C10 -10 14 -28 4 -34 C-6 -30 -8 -12 0 0 Z" fill="${P.white}" transform="rotate(${a})"/>`).join('')}</g><circle r="8" fill="${P.lav}"/></g>`).join('')}
  ${[-90,-70,-50,-30,-10,10,30,50,70,90].map(x=>`<rect x="${x-4}" y="52" width="8" height="12" rx="2" fill="${P.butter2}"/>`).join('')}</g>`;
const cloud=()=>`<g><path d="M-90 30 C-120 30 -124 -10 -96 -18 C-96 -56 -46 -66 -28 -38 C-14 -76 50 -74 56 -26 C96 -28 108 30 70 30 Z" fill="${P.sky}"/>
  ${[0,1,2].map(i=>`<rect x="-46" y="${44+i*30}" width="92" height="22" rx="6" fill="${i%2?P.sky2:P.ink2}"/><circle cx="-30" cy="${55+i*30}" r="4" fill="${P.mint}"/><circle cx="-16" cy="${55+i*30}" r="4" fill="${P.butter}"/>`).join('')}</g>`;
const capitol=()=>`<g><rect x="-130" y="40" width="260" height="20" rx="4" fill="${P.lav2}"/><rect x="-116" y="0" width="232" height="40" rx="4" fill="${P.lav}"/>
  ${[-96,-64,-32,0,32,64,96].map(x=>`<rect x="${x-7}" y="6" width="14" height="30" rx="3" fill="${P.white}"/>`).join('')}
  <rect x="-60" y="-24" width="120" height="24" rx="4" fill="${P.lav2}"/><path d="M-54 -24 A54 54 0 0 1 54 -24 Z" fill="${P.lav}"/>
  <rect x="-5" y="-96" width="10" height="20" rx="3" fill="${P.lav2}"/><circle cx="0" cy="-100" r="7" fill="${P.butter}"/></g>`;
const moon=()=>`<g transform="rotate(-25)"><path d="M0 -40 A40 40 0 1 0 0 40 A50 50 0 0 1 0 -40 Z" fill="${P.butter}"/></g>`;
const star=(s=1)=>`<path transform="scale(${s})" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="${P.butter2}"/>`;
const sun=()=>`<g><circle r="56" fill="${P.butter}"/>${[...Array(12)].map((_,i)=>`<rect x="-4" y="-92" width="8" height="22" rx="4" fill="${P.butter2}" transform="rotate(${i*30})"/>`).join('')}</g>`;
const vmark=()=>`<g><path d="M-80 -70 L-40 -70 L0 30 L40 -70 L80 -70 L16 80 L-16 80 Z" fill="${P.ink}"/><circle cx="0" cy="-48" r="22" fill="${P.butter}"/></g>`;
function lineChart(w,h,pts,c,cid){const d=pts.map((p,i)=>(i?'L':'M')+(p[0]*w-w/2).toFixed(1)+' '+(h/2-p[1]*h).toFixed(1)).join(' ');
  return `<g><rect x="${-w/2-24}" y="${-h/2-24}" width="${w+48}" height="${h+48}" rx="22" fill="${P.white}"/>
  ${[0.25,0.5,0.75].map(y=>`<rect x="${-w/2}" y="${h/2-y*h-1.5}" width="${w}" height="3" rx="1.5" fill="${P.cream2}"/>`).join('')}
  <path id="${cid}" d="${d}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle class="hd" r="11" fill="${c}"/><circle class="hd2" r="5" fill="${P.white}"/></g>`;}
function drawLine(root,id,k){const ln=q(root,'#'+id);const L=ln.getTotalLength();ln.style.strokeDasharray=L;ln.style.strokeDashoffset=L*(1-k);const p=ln.getPointAtLength(L*clamp(k));
  [q(root,'.hd'),q(root,'.hd2')].forEach(c=>{c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.style.opacity=k>0.01?1:0});}
const bgdisc=(r,c=P.cream2)=>`<circle r="${r}" fill="${c}"/>`;

// ---------- scenes ----------
const CX=270, CY=380;
const B={};
B.title=(v,sc)=>{const g=svgEl(`<g class="disc">${bgdisc(200)}</g><g class="sh">${shadow(120,150)}</g>
  <g class="box">${ballotBox()}</g><g class="bal">${ballot()}</g><g class="au">${arrow(P.mint2,true)}</g><g class="ad">${arrow(P.coral2,false)}</g>`);
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.sh'),CX,CY,eo(prog(l,.1,.5)));
    tf(q(g,'.box'),CX,CY+60,eob(prog(l,.1,.6)));const d=eio(prog(l,.5,.9));tf(q(g,'.bal'),CX,CY-140+d*120,1,lerp(-12,0,d));q(g,'.bal').style.opacity=1-prog(l,1.3,.15);
    const a=eob(prog(l,1.2,.6));tf(q(g,'.au'),CX-150,CY-20-a*50,a);tf(q(g,'.ad'),CX+150,CY-20+a*50,a);}};};

B.index=(v,sc)=>{const g=svgEl(`<g class="disc">${bgdisc(210)}</g><g class="sh">${shadow(150,170)}</g>
  <g class="beam"><rect x="-150" y="-6" width="300" height="12" rx="6" fill="${P.ink2}"/></g><g class="piv"><path d="M-22 40 L0 0 L22 40 Z" fill="${P.ink}"/></g>
  <g class="bld">${building()}</g><g class="app">${apple()}</g>`);
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.sh'),CX,CY,eo(prog(l,.1,.5)));
    const tilt=eio(prog(t,wordTime(sc,'weighed')-.3,1.1))*14; // apple side goes down
    const py=CY+130;tf(q(g,'.piv'),CX,py,eob(prog(l,.1,.5)));
    const beam=q(g,'.beam');tf(beam,CX,py,eob(prog(l,.1,.5)),tilt);
    const r=tilt*Math.PI/180,lx=-110,rx=110;
    const pos=(x,yoff)=>[CX+x*Math.cos(r)-yoff*Math.sin(r)*-1, py+x*Math.sin(r)+yoff];
    const a1=eob(prog(l,.3,.6)),a2=eob(prog(t,wordTime(sc,'Apple')-.6,.6));
    const [bx,by]=pos(lx,-6);tf(q(g,'.bld'),bx,by-62*.62,0.62*a1);
    const [ax,ay]=pos(rx,-6);tf(q(g,'.app'),ax,ay-50-(1-a2)*80,1.15*a2);q(g,'.app').style.opacity=clamp(a2*3);}};};

B.stack=(v,sc)=>{const cols=[P.coral,P.mint,P.mint];const cols2=[P.coral2,P.mint2,P.mint2];
  const g=svgEl(`<g class="disc">${bgdisc(210)}</g><g class="sh">${shadow(170,160)}</g>
   ${v.rows.map((r,i)=>`<g class="bar${i}"><rect class="r" x="-38" width="76" rx="14" fill="${cols[i]}"/><rect class="cap" x="-38" width="76" height="20" rx="10" fill="${cols2[i]}"/></g><g class="ar${i}">${arrow(cols2[i],r.pct>=0)}</g>`).join('')}`);
  const base=[150,120,170],grow=[-30,40,90];
  const ts=v.rows.map(r=>r.at?wordTime(sc,r.at):sc.t0);
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,-.2,.6)));tf(q(g,'.sh'),CX,CY,1);
    v.rows.forEach((r,i)=>{const k0=eob(prog(l,-.2+i*.1,.6));const k1=eio(prog(t,ts[i],1.0));const h=Math.max(10,(base[i]+grow[i]*k1)*k0);
      const x=CX+(i-1)*112,yb=CY+160;const bar=q(g,'.bar'+i);bar.setAttribute('transform',`translate(${x} ${yb})`);
      const rr=q(bar,'.r');rr.setAttribute('y',-h);rr.setAttribute('height',h);q(bar,'.cap').setAttribute('y',-h);
      const ak=eob(prog(t,ts[i]+.3,.5));tf(q(g,'.ar'+i),x,yb-h-50+(r.pct>=0?-ak*8:ak*8),ak*.9);});}};};

B.bigword=(v,sc)=>{const g=svgEl(`<g class="disc">${bgdisc(200,P.cream2)}</g><g class="sh">${shadow(110,170)}</g><g class="ring"><circle r="150" fill="none" stroke="${P.butter}" stroke-width="10" stroke-dasharray="40 26" stroke-linecap="round"/></g><g class="ch">${chip()}</g>`);
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.sh'),CX,CY,eo(prog(l,.1,.5))*(1-0.3*Math.abs(Math.sin(l*4.5))*prog(l,.9,.1)));
    tf(q(g,'.ring'),CX,CY,eob(prog(l,.2,.6)),l*30);
    const bounce=prog(l,.9,.01)?Math.abs(Math.sin((l-.9)*4.5))*60*Math.exp(-(l-.9)*1.2):0;
    tf(q(g,'.ch'),CX,CY-bounce,eob(prog(l,.1,.6)));}};};

B.duo=(v,sc)=>{const g=svgEl(`<g class="d1">${bgdisc(150,P.cream2)}</g><g class="d2">${bgdisc(150,P.cream2)}</g><g class="gpu">${gpu()}</g><g class="cl">${cloud()}</g>
  <g class="a1">${arrow(P.mint2,true)}</g><g class="a2">${arrow(P.mint2,true)}</g>`);
  const t1=wordTime(sc,v.cards[0].at),t2=wordTime(sc,v.cards[1].at);
  return {g,update(t){const k1=eob(prog(t,t1-.3,.6)),k2=eob(prog(t,t2-.3,.6));
    tf(q(g,'.d1'),CX,CY-110,k1);tf(q(g,'.gpu'),CX,CY-110,k1*.95);q(g,'.gpu').querySelectorAll('.fan').forEach(f=>f.setAttribute('transform',`rotate(${t*240})`));
    tf(q(g,'.d2'),CX,CY+150,k2);tf(q(g,'.cl'),CX,CY+130,k2*.9);
    const a1=eob(prog(t,t1+.4,.5)),a2=eob(prog(t,t2+.4,.5));tf(q(g,'.a1'),CX+170,CY-130-a1*10,a1*.85);tf(q(g,'.a2'),CX+170,CY+120-a2*10,a2*.85);}};};

B.stock=(v,sc)=>{let g;
  if(v.up){ // Oracle: V-shaped rebound chart + bouncing ball
    const pts=[[0,.75],[.12,.7],[.25,.62],[.4,.15],[.55,.28],[.7,.5],[.85,.62],[1,.7]];
    g=svgEl(`<g class="disc">${bgdisc(215)}</g><g class="ch">${lineChart(330,220,pts,P.mint2,'ln_'+sc.id)}</g><g class="ball"><circle r="22" fill="${P.coral}"/><circle cx="-7" cy="-7" r="6" fill="${P.white}" opacity=".6"/></g>`);
    return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.ch'),CX,CY,eob(prog(l,.1,.6)));drawLine(g,'ln_'+sc.id,eio(prog(l,.5,2.4)));
      const k=prog(l,.4,3);const x=CX-165+k*330;const yb=CY+150;const h=Math.abs(Math.cos(k*Math.PI*2.5))*(130-90*k);tf(q(g,'.ball'),x,yb-22-h,eob(prog(l,.3,.4)));}};}
  // Apple: apple slides down a ramp, pie slice shrinks
  g=svgEl(`<g class="disc">${bgdisc(215)}</g><g class="ramp"><path d="M-170 -60 L170 90 L170 110 L-170 110 Z" fill="${P.coral}" opacity=".35"/><path d="M-170 -60 L170 90" stroke="${P.coral2}" stroke-width="8" stroke-linecap="round"/></g>
    <g class="app">${apple()}</g><g class="pie"><circle r="44" fill="${P.butter}"/><path class="sl" fill="${P.butter2}"/></g>`);
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.ramp'),CX,CY+60,eob(prog(l,.1,.6)));
    const k=eio(prog(l,.6,2.2));const x=-150+k*260,y=-60+k*(150/340)*260;tf(q(g,'.app'),CX+x,CY+60+y-50,eob(prog(l,.2,.5))*.8,k*160);
    const pk=eob(prog(t,wordTime(sc,'margin')-.2,.5));tf(q(g,'.pie'),CX-110,CY-150,pk);
    const ang=lerp(110,60,eio(prog(t,wordTime(sc,'margin')+.2,1.4)))*Math.PI/180;const sl=q(g,'.sl');
    sl.setAttribute('d',`M0 0 L0 -44 A44 44 0 0 1 ${44*Math.sin(ang)} ${-44*Math.cos(ang)} Z`);}};};

B.earnings=(v,sc)=>{const g=svgEl(`<g class="disc">${bgdisc(215,P.cream2)}</g><g class="moon">${moon()}</g>${[[-170,-180,1],[150,-210,.8],[190,-90,.6],[-200,-60,.7]].map((s,i)=>`<g class="st${i}" data-x="${s[0]}" data-y="${s[1]}">${star(s[2])}</g>`).join('')}
   <g class="sh">${shadow(150,170)}</g><g class="b1"><rect class="r" x="-36" width="72" rx="14" fill="${P.mint}"/></g><g class="b2"><rect class="r" x="-36" width="72" rx="14" fill="${P.butter}"/></g>
   <g class="ch">${chip(P.peach,P.coral2,.55)}</g><g class="ar">${arrow(P.mint2,true)}</g>`);
  const tg=wordTime(sc,'guided'),tj=wordTime(sc,'jumped');
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.moon'),CX-150,CY-180,eob(prog(l,.2,.6)));
    [0,1,2,3].forEach(i=>{const s=q(g,'.st'+i);tf(s,CX+ +s.dataset.x,CY+ +s.dataset.y,eob(prog(l,.3+i*.12,.5))*(0.8+0.2*Math.sin(t*3+i)),t*20);});
    tf(q(g,'.sh'),CX,CY,1);const yb=CY+165;
    const h1=134*eio(prog(l,.8,1.2)),h2=170*eio(prog(t,tg,1.2));
    [[q(g,'.b1'),CX-60,h1],[q(g,'.b2'),CX+60,h2]].forEach(([b,x,h])=>{b.setAttribute('transform',`translate(${x} ${yb})`);const r=q(b,'.r');r.setAttribute('y',-Math.max(0,h));r.setAttribute('height',Math.max(0,h));});
    tf(q(g,'.ch'),CX+130,CY-30,eob(prog(l,.3,.6)));const ak=eob(prog(t,tj-.2,.6));tf(q(g,'.ar'),CX+130,CY-140-ak*20,ak);}};};

B.ahead=(v,sc)=>{const g=svgEl(`<g class="disc">${bgdisc(215)}</g><g class="sh">${shadow(160,120)}</g><g class="cap">${capitol()}</g><g class="moon">${moon()}</g>
  <g class="gauge"><path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="${P.cream3}" stroke-width="18" stroke-linecap="round"/><path d="M-70 0 A70 70 0 0 1 -21.6 -66.6" fill="none" stroke="${P.mint}" stroke-width="18" stroke-linecap="round"/><path d="M21.6 -66.6 A70 70 0 0 1 70 0" fill="none" stroke="${P.coral}" stroke-width="18" stroke-linecap="round"/>
   <g class="needle"><rect x="-4" y="-60" width="8" height="60" rx="4" fill="${P.ink}"/></g><circle r="10" fill="${P.ink}"/></g>
  <g class="bal">${ballot()}</g>`);
  const tO=wordTime(sc,'options');
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));tf(q(g,'.sh'),CX,CY-60,1);tf(q(g,'.cap'),CX,CY-10,eob(prog(l,.1,.6))*.95);
    tf(q(g,'.moon'),CX+150,CY-170,eob(prog(l,.4,.6))*.7);const bk=eob(prog(t,wordTime(sc,'midterm')-.1,.5));tf(q(g,'.bal'),CX-150,CY-150+Math.sin(t*2)*6,bk*.8,-10);
    const gk=eob(prog(t,tO-.2,.6));tf(q(g,'.gauge'),CX,CY+210,gk);q(g,'.needle').setAttribute('transform',`rotate(${Math.sin(t*2.4)*28})`);}};};

B.end=(v,sc)=>{const g=svgEl(`<defs><clipPath id="sky"><rect x="0" y="0" width="540" height="${CY+125}"/></clipPath></defs><g class="disc">${bgdisc(215)}</g><g clip-path="url(#sky)"><g class="sun">${sun()}</g></g><g class="hz"><rect x="-180" y="-5" width="360" height="10" rx="5" fill="${P.ink2}"/></g><g class="v">${vmark()}</g>`);
  return {g,update(t){const l=t-sc.t0;tf(q(g,'.disc'),CX,CY,eob(prog(l,0,.6)));const s=eio(prog(l,.3,1.6));tf(q(g,'.sun'),CX,CY+120-s*170,1,l*15);tf(q(g,'.hz'),CX,CY+125,eob(prog(l,0,.5)));
    tf(q(g,'.v'),CX,CY+270,eob(prog(l,1.2,.7))*.7);}};};

// ---------- captions (optional) ----------
let CH=[],last=null;
function buildChunks(){for(const sc of T.scenes){let cur=[];sc.words.forEach((w,i)=>{cur.push(w);const len=cur.map(x=>x.w).join(' ').length;if(/[.,:;!?]$/.test(w.w)||cur.length>=3||len>=17||i===sc.words.length-1){CH.push(cur);cur=[]}});}}
function drawCap(t){const cap=document.getElementById('cap');let ch=null;for(const c of CH)if(t>=c[0].t0-.05)ch=c;
  if(!ch||t>ch[ch.length-1].t1+.6){cap.innerHTML='';last=null;return}
  if(last!==ch){cap.innerHTML=ch.map(w=>`<span>${w.w}</span>`).join('');last=ch}
  [...cap.children].forEach((s,i)=>{const w=ch[i];s.className=t>=w.t1?'done':(t>=w.t0?'on':'')});}

window.init=(script,timing,opts={})=>{S=script;T=timing;if(opts.captions)document.body.classList.add('captions');
  S.scenes.forEach((s,i)=>{const sc=T.scenes[i];const o=B[s.visual.type](s.visual,sc);SC.push({...o,sc});});buildChunks();window.__ready=true;};
window.render=t=>{SC.forEach((o,i)=>{const a=o.sc.t0-.25,b=o.sc.t1-.15;const last=i===SC.length-1;
  const kin=eo(prog(t,a,.3)),kout=last?0:eio(prog(t,b,.3));const op=kin*(1-kout);o.g.style.display=op>0.001?'':'none';
  if(op>0.001){o.update(t);o.g.style.opacity=op;}});drawCap(t);};
</script></body></html>
