<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#F4ECDF;font-family:Montserrat,sans-serif}
svg{position:absolute;left:0;top:0}
#cap{position:absolute;left:0;right:0;top:716px;text-align:center;font-weight:800;font-size:23px;white-space:nowrap;display:none}
#cap span{display:inline-block;margin:0 3.5px;color:#C9BFAF}
#cap span.done{color:#3E4A63}
#cap span.on{color:#E07A6B}
body.captions #cap{display:block}
#nums{position:absolute;left:10px;right:10px;top:626px;height:78px;display:flex;justify-content:center;align-items:flex-start;gap:8px}
.nc{flex:1 1 0;max-width:172px;min-width:0;background:#FFFDF8;border-radius:16px;padding:8px 10px 9px;box-shadow:0 6px 16px rgba(62,74,99,.16);border:2px solid transparent;text-align:center;opacity:0}
.nc.up{border-color:#8FD3B6}.nc.dn{border-color:#F19C8E}.nc.nt{border-color:#E9B65A}
.nc .v.tx{font-size:15px;letter-spacing:.2px;padding:6px 0 4px}
#nums .row{display:flex;gap:8px;width:100%;justify-content:center;position:absolute;left:0;top:0}
#nums .row.sm .v{font-size:21px}#nums .row.sm .l{font-size:8.5px;letter-spacing:1px}#nums .row.sm .nc{padding:8px 6px 9px}
#hdr{position:absolute;left:0;right:0;top:128px;display:flex;justify-content:center;gap:8px;opacity:0}
#hdr span{font-weight:800;font-size:11px;letter-spacing:2px;padding:6px 12px;border-radius:14px;background:#FFFDF8;color:#5B6782;box-shadow:0 3px 8px rgba(62,74,99,.12)}
#hdr .a{background:#E07A6B;color:#fff}#hdr .c:empty{display:none}
.nc .l{font-weight:800;font-size:10px;letter-spacing:1.6px;color:#5B6782;white-space:nowrap}
.nc .v{font-weight:900;font-size:27px;line-height:1.05;color:#3E4A63;letter-spacing:-.5px;white-space:nowrap}
.nc .d{display:inline-block;margin-top:3px;font-weight:800;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.nc.up .d{background:#CDEEDF;color:#2F8A66}.nc.dn .d{background:#F9D5CD;color:#C45A4B}.nc.nt .d{background:#FBEBC5;color:#A9741B}
.nc.up .v.dv{color:#2F8A66}.nc.dn .v.dv{color:#C45A4B}
</style></head>
<body>
<svg id="stage" width="540" height="960" viewBox="35 50 470 835"></svg>
<div id="nums"></div>
<div id="cap"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const prog=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const P={cream:'#F4ECDF',cream2:'#EADFCD',cream3:'#DFD1BB',ink:'#3E4A63',ink2:'#5B6782',ink3:'#8691A8',mint:'#8FD3B6',mint2:'#5FB894',mint3:'#CDEEDF',coral:'#F19C8E',coral2:'#E07A6B',coral3:'#F9D5CD',
  butter:'#F6D186',butter2:'#E9B65A',butter3:'#FBEBC5',sky:'#A7C7EA',sky2:'#7FA8D8',sky3:'#D5E5F6',lav:'#C3B3E6',lav2:'#9E8AD3',lav3:'#E6DEF5',peach:'#F7C3A0',white:'#FFFDF8'};
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
let S,T,SC=[];
const CX=270,CY=350;
function wordTime(sc,key){if(!key)return sc.t0+.3;const w=sc.words.find(w=>w.w.replace(/[^\w&]/g,'').toLowerCase().startsWith(key.toLowerCase()));return w?w.t0:sc.t0+.3;}

// ---------- tiny SVG helpers ----------
const rr=(x,y,w,h,r,f,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${extra}/>`;
const ci=(x,y,r,f,extra='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${extra}/>`;
const pa=(d,f,extra='')=>`<path d="${d}" fill="${f}" ${extra}/>`;
const st=(d,c,w=6,extra='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const shadow=(w,y=0)=>`<ellipse cx="0" cy="${y}" rx="${w}" ry="${w*0.11}" fill="${P.cream3}" opacity=".9"/>`;

// ---------- detailed illustrations (origin = centre of art) ----------
const A={};
A.nyse=()=>`<g>${shadow(150,92)}
  ${rr(-135,70,270,16,3,P.sky2)}${rr(-122,56,244,14,3,P.sky)}${rr(-110,44,220,12,3,P.sky2)}
  ${[-84,-56,-28,0,28,56,84].map(x=>rr(x-9,-48,18,92,4,P.white)+rr(x-5,-48,4,92,2,P.sky3)).join('')}
  ${rr(-116,-62,232,16,3,P.sky)}${rr(-116,-50,232,4,1,P.sky2)}
  ${pa('M-124 -62L0 -118L124 -62Z',P.sky2)}${pa('M-100 -66L0 -108L100 -66Z',P.sky3)}
  ${ci(0,-84,11,P.white)}${ci(0,-84,5,P.butter2)}
  ${rr(-2,-146,4,34,2,P.ink2)}${pa('M2 -146L30 -137L2 -128Z',P.coral)}
  ${rr(-14,6,28,38,3,P.sky2)}${rr(-14,6,28,38,3,'none')}</g>`;
A.apple=()=>`<g>${pa('M0 -26C-20 -44 -58 -36 -58 4C-58 38 -30 62 -14 58C-7 56 7 56 14 58C30 62 58 38 58 4C58 -36 20 -44 0 -26Z',P.coral)}
  ${pa('M26 -22C48 -14 58 8 52 30C50 38 44 46 38 50C50 28 46 2 26 -22Z',P.coral2,'opacity=".55"')}
  ${st('M-34 -8C-38 8 -32 24 -23 34',P.white,7,'opacity=".6"')}
  ${rr(-3.5,-54,7,26,3.5,P.ink2)}${pa('M5 -44C16 -66 38 -64 42 -58C34 -45 16 -40 5 -44Z',P.mint2)}${st('M10 -46C20 -54 30 -57 37 -58',P.mint,2.5)}
  ${ci(40,38,0.1,'none')}</g>`;
A.coin=(s=1)=>`<g transform="scale(${s})">${ci(0,0,22,P.butter2)}${ci(0,0,17,P.butter)}${st('M-5 -8V8M5 -8V8M-8 -3H8M-8 3H8',P.butter2,2.4)}</g>`;
A.coins=()=>`<g>${shadow(54,32)}${[0,1,2].map(i=>`<g transform="translate(0 ${24-i*14})">${rr(-34,-6,68,16,8,P.butter2)}${rr(-34,-12,68,16,8,P.butter)}${rr(-26,-9,22,3,1.5,P.butter3)}</g>`).join('')}</g>`;
A.chip=(s=1)=>`<g transform="scale(${s})">${[-42,-21,0,21,42].map(v=>rr(v-5,-98,10,28,4,P.butter2)+rr(v-5,70,10,28,4,P.butter2)+rr(-98,v-5,28,10,4,P.butter2)+rr(70,v-5,28,10,4,P.butter2)).join('')}
  ${rr(-76,-76,152,152,20,P.butter)}${rr(-76,-76,152,152,20,'none')}${rr(-52,-52,104,104,12,P.butter3)}
  ${st('M-36 -20H-10V-36M36 20H10V36M-36 20H-20M36 -20H20M-10 36V20',P.butter2,4)}${ci(-36,-20,5,P.butter2)}${ci(36,20,5,P.butter2)}${ci(-10,-36,5,P.butter2)}${ci(10,36,5,P.butter2)}
  ${rr(-24,-24,48,48,8,P.white)}${rr(-12,-12,24,24,5,P.butter2)}</g>`;
A.gpu=()=>`<g>${shadow(120,58)}${rr(-124,-50,248,100,16,P.lav)}${rr(-124,34,248,16,8,P.lav2)}${rr(-112,-40,224,70,12,P.lav3,'opacity=".55"')}
  ${[-58,58].map(x=>`<g transform="translate(${x} -6)">${ci(0,0,40,P.lav2)}${ci(0,0,34,P.lav3)}<g class="fan">${[0,60,120,180,240,300].map(a=>pa('M0 0C12 -10 16 -26 6 -32C-6 -30 -9 -12 0 0Z',P.lav,`transform="rotate(${a})"`)).join('')}</g>${ci(0,0,8,P.lav2)}</g>`).join('')}
  ${[-100,-80,-60,-40,-20,0,20,40,60,80,100].map(x=>rr(x-4,50,8,14,2,P.butter2)).join('')}${rr(-124,-10,8,22,3,P.ink2)}${rr(112,-30,14,40,3,P.mint2)}</g>`;
A.cloud=()=>`<g>${shadow(110,92)}${pa('M-92 28C-124 28 -128 -14 -98 -22C-98 -62 -46 -72 -28 -42C-12 -82 54 -80 60 -30C102 -32 114 28 74 28Z',P.sky)}${pa('M-60 -30C-52 -56 -30 -58 -22 -46',P.sky3,'opacity=".0"')}
  ${st('M-80 -8C-70 -34 -50 -44 -34 -42',P.sky3,6,'opacity=".8"')}
  ${[0,1,2].map(i=>`${rr(-52,42+i*30,104,24,7,i%2?P.sky2:P.ink2)}${ci(-36,54+i*30,4,P.mint)}${ci(-22,54+i*30,4,P.butter)}${rr(8,51+i*30,36,6,3,P.cream)}`).join('')}${st('M0 26V42',P.ink2,5)}</g>`;
A.ballotBox=()=>`<g>${shadow(100,98)}${rr(-86,-20,172,116,14,P.sky)}${rr(-86,-20,172,28,12,P.sky2)}${rr(-46,-12,92,10,5,P.ink)}
  ${rr(-70,24,140,6,3,P.sky3,'opacity=".8"')}${rr(-70,40,100,6,3,P.sky3,'opacity=".8"')}${pa('M-20 70L-6 84L22 56',P.white,'opacity="0"')}${st('M-24 70L-8 84L24 54',P.white,8)}</g>`;
A.ballot=()=>`<g>${rr(-36,-50,72,92,7,P.white)}${rr(-36,-50,72,14,7,P.coral)}${st('M-20 -6L-6 8L20 -20',P.mint2,8)}${rr(-22,20,44,6,3,P.cream3)}${rr(-22,30,30,6,3,P.cream3)}</g>`;
A.flag=()=>`<g>${rr(-2,-60,5,120,2.5,P.ink2)}<g class="wave">${pa('M3 -58C30 -68 52 -50 82 -60V-10C52 0 30 -18 3 -8Z',P.white)}${[0,1,2,3].map(i=>pa(`M3 ${-58+i*12}C30 ${-68+i*12} 52 ${-50+i*12} 82 ${-60+i*12}V${-54+i*12}C52 ${-44+i*12} 30 ${-62+i*12} 3 ${-52+i*12}Z`,i%2?'none':P.coral)).join('')}${pa('M3 -58C16 -63 28 -60 38 -57V-33C28 -36 16 -39 3 -34Z',P.sky2)}</g></g>`;
A.arrow=(c,up=true,s=1)=>`<g transform="scale(${s}) rotate(${up?0:180})">${pa('M0 -38L32 0H14V34H-14V0H-32Z',c)}${pa('M0 -38L32 0H14V-6L0 -24Z',P.white,'opacity=".25"')}</g>`;
A.capitol=()=>`<g>${shadow(150,92)}${rr(-140,70,280,16,3,P.lav2)}${rr(-126,52,252,18,3,P.lav)}
  ${rr(-120,6,240,46,4,P.lav3)}${[-98,-70,-42,-14,14,42,70,98].map(x=>rr(x-7,10,14,38,3,P.white)).join('')}${rr(-130,-4,260,12,3,P.lav)}
  ${rr(-70,-34,140,30,4,P.lav2)}${[-48,-24,0,24,48].map(x=>rr(x-6,-30,12,22,3,P.lav3)).join('')}
  ${pa('M-62 -34A62 62 0 0 1 62 -34Z',P.lav)}${pa('M-44 -34A44 44 0 0 1 44 -34Z',P.lav3,'opacity=".6"')}${rr(-8,-104,16,22,3,P.lav2)}${ci(0,-110,9,P.butter)}${rr(-2,-134,3,22,1.5,P.ink2)}${pa('M1 -134L22 -128L1 -122Z',P.coral)}</g>`;
A.moon=()=>`<g><circle r="42" fill="${P.butter}"/><circle cx="20" cy="-12" r="38" fill="${P.cream2}"/>${ci(-18,-4,3,P.butter2)}${ci(-24,14,2,P.butter2)}</g>`;
A.star=(s=1)=>`<path transform="scale(${s})" d="M0 -14L3.5 -3.5L14 0L3.5 3.5L0 14L-3.5 3.5L-14 0L-3.5 -3.5Z" fill="${P.butter2}"/>`;
A.sun=()=>`<g>${ci(0,0,60,P.butter)}${ci(0,0,48,P.butter3,'opacity=".6"')}${[...Array(14)].map((_,i)=>rr(-4,-98,8,24,4,P.butter2,`transform="rotate(${i*360/14})"`)).join('')}</g>`;
A.vmark=()=>`<g>${pa('M-84 -72H-42L0 34L42 -72H84L18 84H-18Z',P.ink)}${ci(0,-50,23,P.butter)}${ci(0,-50,13,P.butter3)}</g>`;
A.gauge=()=>`<g>${pa('M-80 0A80 80 0 0 1 80 0L56 0A56 56 0 0 0 -56 0Z',P.cream3)}${pa('M-80 0A80 80 0 0 1 -40 -69L-28 -48A56 56 0 0 0 -56 0Z',P.mint)}${pa('M40 -69A80 80 0 0 1 80 0L56 0A56 56 0 0 0 28 -48Z',P.coral)}${pa('M-40 -69A80 80 0 0 1 40 -69L28 -48A56 56 0 0 0 -28 -48Z',P.butter)}
  <g class="needle">${pa('M-5 0L0 -64L5 0Z',P.ink)}</g>${ci(0,0,11,P.ink)}${ci(0,0,4,P.cream)}</g>`;
A.calendar=()=>`<g>${rr(-44,-44,88,88,12,P.white)}${rr(-44,-44,88,26,12,P.coral)}${rr(-44,-30,88,12,0,P.coral)}${rr(-26,-54,8,18,4,P.ink2)}${rr(18,-54,8,18,4,P.ink2)}
  ${[0,1,2].flatMap(r=>[0,1,2,3].map(c=>rr(-33+c*20,-8+r*17,13,10,3,(r===1&&c===2)?P.mint2:P.cream2))).join('')}</g>`;
A.phone=()=>`<g>${rr(-26,-48,52,96,10,P.ink2)}${rr(-22,-42,44,84,7,P.sky3)}${rr(-8,-46,16,3,1.5,P.ink)}${ci(0,38,3,P.ink3)}${pa('M-16 -20L-6 -8L4 -16L16 -30',P.cream,'opacity="0"')}${st('M-14 14L-4 4L4 10L14 -6',P.coral2,3.5)}</g>`;
A.rack=()=>`<g>${[0,1,2].map(i=>`${rr(-52,i*32,104,26,7,i%2?P.sky2:P.ink2)}${ci(-36,i*32+13,4,P.mint)}${ci(-22,i*32+13,4,P.butter)}${rr(8,i*32+10,36,6,3,P.cream)}`).join('')}</g>`;
A.db=()=>`<g>${rr(-46,-42,92,92,0,P.sky)}${pa('M-46 -42A46 16 0 0 1 46 -42A46 16 0 0 1 -46 -42Z',P.sky3)}${pa('M-46 8A46 16 0 0 0 46 8V18A46 16 0 0 1 -46 18Z',P.sky2)}${pa('M-46 -16A46 16 0 0 0 46 -16V-6A46 16 0 0 1 -46 -6Z',P.sky2)}${pa('M-46 38A46 16 0 0 0 46 38V50A46 16 0 0 1 -46 50Z',P.sky2)}</g>`;
A.pie=()=>`<g>${ci(0,0,50,P.butter)}${ci(0,0,50,'none')}<path class="sl" fill="${P.coral}"/>${ci(0,0,14,P.cream)}</g>`;
A.chartCard=(w,h)=>`<g>${rr(-w/2-10,-h/2-10,w+20,h+20,22,P.white)}${[.25,.5,.75].map(y=>rr(-w/2,h/2-y*h-1.5,w,3,1.5,P.cream2)).join('')}${rr(-w/2,h/2-2,w,4,2,P.ink3,'opacity=".5"')}${rr(-w/2,-h/2,4,h,2,P.ink3,'opacity=".5"')}</g>`;
const cloudy=(s=1)=>`<g transform="scale(${s})">${pa('M-34 12C-52 12 -54 -10 -38 -14C-38 -34 -10 -38 -2 -22C6 -42 36 -40 38 -14C56 -14 58 12 42 12Z',P.white)}</g>`;
const skyline=()=>`<g>${[[-250,50,34,90,P.sky3],[-214,50,26,60,P.lav3],[-186,50,40,110,P.cream2],[-144,50,28,70,P.sky3],[-114,50,36,96,P.lav3],[-76,50,30,54,P.cream2],[-44,50,44,126,P.sky3],[2,50,30,66,P.lav3],[34,50,38,100,P.cream2],[74,50,32,60,P.sky3],[108,50,42,118,P.lav3],[152,50,30,76,P.cream2],[184,50,36,92,P.sky3],[222,50,32,58,P.lav3]].map(([x,y,w,h,c])=>rr(x,y-h,w,h,3,c)+[0,1,2].map(i=>rr(x+6,y-h+10+i*20,w-12,6,2,P.white,'opacity=".7"')).join('')).join('')}</g>`;

// ---------- scene machinery ----------
const gl=document.createElementNS(NS,'g');
// persistent background
const bgG=document.createElementNS(NS,'g');stage.appendChild(bgG);
bgG.innerHTML=`<g transform="translate(270 596)">${skyline()}</g>${rr(0,596,540,300,0,P.cream2,'opacity=".0"')}
 <g id="bgc1">${cloudy(1.1)}</g><g id="bgc2">${cloudy(.8)}</g><g id="bgc3">${cloudy(.9)}</g>`;
function pm(x,y){return `translate(${x} ${y})`}
function makeScene(sc,items,anim){
  const root=document.createElementNS(NS,'g');stage.appendChild(root);root.setAttribute('transform','translate(270 588.8) scale(.88) translate(-270 -565)');
  const its=items.map(it=>{const g=document.createElementNS(NS,'g');g.innerHTML=it.svg;root.appendChild(g);
    const start=typeof it.at==='object'?wordTime(sc,it.at.w)+(it.at.o||0):sc.t0+(it.at||0);return {...it,g,start};});
  return {root,its,sc,anim};}
function updScene(o,t){
  const {sc,its}=o;
  its.forEach(it=>{const k=eob(prog(t,it.start,it.dur||.6));const kk=clamp(k);const f=it.from||'pop';let x=it.x,y=it.y,s=it.s||1,r=it.r||0;
    if(f==='pop')s*=kk;else if(f==='up'){y+=(1-k)*70;}else if(f==='down'){y-=(1-k)*70;}else if(f==='left'){x-=(1-k)*90;}else if(f==='right'){x+=(1-k)*90;}
    if(it.bob)y+=Math.sin(t*(it.bobf||2)+it.x)*it.bob;if(it.spin)r+=t*it.spin;if(it.fn){const q=it.fn(t,sc.t0,k);if(q){x=q.x??x;y=q.y??y;s=q.s??s;r=q.r??r;}}
    it.g.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);it.g.style.opacity=f==='pop'?1:clamp(k*2);});
  o.anim&&o.anim(t,t-sc.t0,o);}
const I=(svg,x,y,at,o={})=>({svg,x,y,at,...o});
const disc=(r=210,c=P.cream2,at=0)=>I(`<circle r="${r}" fill="${c}"/>`,CX,CY,at,{dur:.7});
const confetti=(n=14,seed=3,cols=[P.coral,P.mint,P.butter,P.sky,P.lav])=>{let r=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(seed);return [...Array(n)].map((_,i)=>{const x=60+r()*420,y=120+r()*200;const c=cols[i%cols.length];return I(i%3?rr(-5,-9,10,18,3,c):ci(0,0,6,c),x,y,.5+r()*1.2,{bob:6,bobf:1.5+r()*2,spin:20+r()*60,dur:.4})})};

// ---------- scenes ----------
const B={};
B.title=(v,sc)=>{const items=[disc(215,P.cream2,0),
  I(`<g>${A.ballotBox()}</g>`,CX,CY+50,.15,{s:1.15}),
  I(`<g>${A.flag()}</g>`,CX+120,CY-10,.4,{s:1,bob:3}),
  I(A.ballot(),CX,CY-140,.2,{from:'none',fn:(t,t0)=>{const d=eio(prog(t-t0,.6,.9));return {y:CY-190+d*140,r:lerp(-14,0,d),s:(1-prog(t-t0,1.35,.2))*1}}}),
  I(`<g>${A.arrow(P.mint2,true,1.1)}</g>`,CX-170,CY-60,1.2,{bob:6}),I(`<g>${A.arrow(P.coral2,false,1.1)}</g>`,CX+170,CY+30,1.3,{bob:6}),
  I(`<path d="M0 -190V190" stroke="${P.ink3}" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" fill="none"/>`,CX,CY,.9,{dur:.6}),
  I(st('M-40 40L-18 18L-2 28L22 -4',P.mint2,6)+ci(22,-4,6,P.mint2),CX-150,CY+100,1.4,{}),
  I(st('M-22 -4L-2 18L14 8L40 40',P.coral2,6)+ci(-22,-4,6,P.coral2),CX+140,CY+110,1.5,{}),
  ...confetti(16,5)];
  return makeScene(sc,items,(t,l,o)=>{o.its.forEach(it=>{if(it.svg.includes('class="wave"')){}})});};

B.index=(v,sc)=>{const tw=wordTime(sc,'weighed')-.3,ta=wordTime(sc,'Apple')-.6;
  const items=[disc(215,P.cream2,0),
    I(`<g>${rr(-100,-100,200,130,18,P.white)}${st('M-80 -72L-50 -62L-24 -48L4 -36L30 -22L58 -4L82 10',P.coral2,6)}${ci(82,10,7,P.coral2)}${[-70,-30,10,50].map(x=>rr(x,24,16,0,0,'none')).join('')}</g>`,CX,CY-150,.5,{s:.9}),
    I(`<g>${pa('M-26 46L0 0L26 46Z',P.ink)}${rr(-40,44,80,12,6,P.ink2)}</g>`,CX,CY+118,.1,{}),
    I(`<g id="beam">${rr(-160,-6,320,12,6,P.ink2)}${rr(-160,-6,320,4,2,P.ink3,'opacity=".5"')}</g>`,CX,CY+118,.2,{}),

// ---------- on-screen numbers (callouts) ----------
// script.json scene.callouts: [{label, num|delta|text, at:'word', prefix, suffix, dec, ddec, approx, dir:'up|dn|nt'}]
//  delta -> big colored arrow + percent (mint up / coral down); num -> big number (+ optional small delta pill); text -> short word chip
let NC=[],HDR=null;
const fmtN=(n,dec)=>n.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
function buildNums(){const host=document.getElementById('nums');
  HDR=document.createElement('div');HDR.id='hdr';HDR.innerHTML='<span class="a">MARKET CLOSE</span><span class="b">'+(S.dateLabel||'')+'</span><span class="c"></span>';document.body.appendChild(HDR);
  S.scenes.forEach((s,i)=>{const sc=T.scenes[i];const row=document.createElement('div');row.className='row'+((s.callouts||[]).length>=4?' sm':'');host.appendChild(row);
    const items=(s.callouts||[]).map(c=>{const el=document.createElement('div');
      const dir=c.delta!=null&&c.num==null?(c.delta>=0?'up':'dn'):(c.dir||(c.delta!=null?(c.delta>=0?'up':'dn'):'nt'));
      el.className='nc '+dir;
      el.innerHTML='<div class="l">'+c.label+'</div><div class="v'+(c.num==null&&c.delta!=null?' dv':'')+(c.text?' tx':'')+'"></div>'+(c.num!=null&&c.delta!=null?'<div class="d">'+(c.delta>=0?'▲ ':'▼ ')+Math.abs(c.delta).toFixed(c.ddec??2)+'%</div>':'');
      row.appendChild(el);return {el,c,at:c.at?wordTime(sc,c.at)+(c.o||0):sc.t0+.2,v:el.querySelector('.v')};});
    NC.push({row,items,sc,tag:s.tag||''});});}
function drawNums(t){let tag='';NC.forEach(g=>{const vis=t>=g.sc.t0-.1&&t<=g.sc.t1-.05;g.row.style.display=vis?'flex':'none';if(!vis)return;tag=g.tag;
  const ex=prog(t,g.sc.t1-.4,.3);
  g.items.forEach(it=>{const k=clamp(eob(prog(t,it.at,.5)));const cnt=eo(prog(t,it.at+.05,.9));const c=it.c;
    it.el.style.opacity=k*(1-ex)*(t>=it.at?1:0);it.el.style.transform='translateY('+((1-k)*26)+'px) scale('+(.85+.15*k)+')';
    if(c.text)it.v.textContent=c.text;
    else if(c.num!=null)it.v.textContent=(c.prefix||'')+fmtN(c.num*cnt,c.dec||0)+(c.suffix||'');
    else it.v.textContent=(c.delta>=0?'▲ ':'▼ ')+(c.approx?'~':'')+Math.abs(c.delta*cnt).toFixed(c.ddec??2)+'%';});});
  if(HDR){HDR.style.opacity=tag?1:0;HDR.querySelector('.c').textContent=tag;}}

// ---------- captions ----------
let CH=[],last=null;
function buildChunks(){for(const sc of T.scenes){let cur=[];sc.words.forEach((w,i)=>{cur.push(w);const len=cur.map(x=>x.w).join(' ').length;if(/[.,:;!?]$/.test(w.w)||cur.length>=3||len>=17||i===sc.words.length-1){CH.push(cur);cur=[]}});}}
function drawCap(t){const cap=document.getElementById('cap');let ch=null;for(const c of CH)if(t>=c[0].t0-.05)ch=c;
  if(!ch||t>ch[ch.length-1].t1+.6){cap.innerHTML='';last=null;return}
  if(last!==ch){cap.innerHTML=ch.map(w=>`<span>${w.w}</span>`).join('');last=ch}
  [...cap.children].forEach((s,i)=>{const w=ch[i];s.className=t>=w.t1?'done':(t>=w.t0?'on':'')});}

window.init=(script,timing,opts={})=>{S=script;T=timing;if(opts.captions)document.body.classList.add('captions');
  S.scenes.forEach((s,i)=>{SC.push(B[s.visual.type](s.visual,T.scenes[i]));});buildChunks();buildNums();window.__ready=true;};
window.render=t=>{
  [['bgc1',70,160,22,.9],['bgc2',420,120,16,.7],['bgc3',250,230,12,1.1]].forEach(([id,x,y,sp,ph])=>{const e=document.getElementById(id);const w=(x+t*sp)%640-60;e.setAttribute('transform',`translate(${w} ${y+Math.sin(t*.5+ph)*8})`);e.style.opacity=.9;});
  SC.forEach((o,i)=>{const a=o.sc.t0-.25,b=o.sc.t1-.15;const last=i===SC.length-1;
    const kin=eo(prog(t,a,.3)),kout=last?0:eio(prog(t,b,.3));const op=kin*(1-kout);o.root.style.display=op>0.001?'':'none';
    if(op>0.001){updScene(o,t);o.root.style.opacity=op;}});drawCap(t);drawNums(t);};
