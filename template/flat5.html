<!--
flat5.html: the standing daily look from Nov 14 2026 (Vince: "merge this graphic style with all future daily videos").
It is the look of the 30-second ad (demos/ad-fable): one three.js world on the cream background, real charts as 3D ribbons,
sector bars on the ground, headline cards, the V coin end card, one camera that travels from scene to scene with motion blur.
Same contract as flat4: window.init(script, timing, {captions}) then window.render(t). Same script.json, no new required fields.
Render with render3d.mjs (render.mjs hands 3D pages over to it).

Scene types drawn in 3D: ichart, schart, duochart, sectors, news, end. Any other type (bounce, selloff, exit, wrap, ...) is an
"opener": the hook number over the day's real chart. Optional extras: script.hook.sub ("GONE. IN ONE DAY."), scene.headline
(big title for a scene; otherwise the visual title or the tag is used).
-->

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const P={cream:'#F4ECDF',cream2:'#EADFCD',cream3:'#DFD1BB',ink:'#3E4A63',ink2:'#5B6782',ink3:'#8691A8',mint:'#8FD3B6',mint2:'#5FB894',mint3:'#CDEEDF',green:'#2F8A66',coral:'#F19C8E',coral2:'#E07A6B',coral3:'#F9D5CD',red:'#C45A4B',
 butter:'#F6D186',butter2:'#E9B65A',butter3:'#FBEBC5',sky:'#A7C7EA',sky2:'#7FA8D8',sky3:'#D5E5F6',lav:'#C3B3E6',lav2:'#9E8AD3',lav3:'#E6DEF5',peach:'#F7C3A0',white:'#FFFDF8'};
const W=540,H=960,FPS=30,GAP=14;
const $=id=>document.getElementById(id),ui=$('ui');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3),eo5=x=>1-Math.pow(1-x,5),ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=(x,c=1.70158)=>1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);
const spring=x=>x<=0?0:x>=1?1:1-Math.exp(-7*x)*Math.cos(11*x);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const noise=(t,s)=>Math.sin(t*1.7+s)*.5+Math.sin(t*2.9+s*2.3)*.3+Math.sin(t*4.7+s*5.1)*.2;
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let S,T,DUR=30,SC=[];
function wordTime(sc,key){if(!key)return sc.t0+.3;const w=sc.words.find(w=>w.w.replace(/[^\w&]/g,'').toLowerCase().startsWith(String(key).toLowerCase()));return w?w.t0:sc.t0+.3}

// ---------- renderer ----------
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(2);renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,W/H,.1,300);
scene.add(new THREE.HemisphereLight(0xffffff,0xF0E2CC,2.05));
const sun=new THREE.DirectionalLight(0xFFF3DE,1.9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40});sun.shadow.bias=-.0006;sun.shadow.radius=7;
scene.add(sun,sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,80),new THREE.ShadowMaterial({color:0x6B5A3C,opacity:.13}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const envTex=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.03).texture;

const matte=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:0,...o});
const flat=(c,o={})=>new THREE.MeshBasicMaterial({color:c,...o});
const tint=(c,k=.62)=>'#'+new THREE.Color(c).lerp(new THREE.Color('#FFFDF8'),k).getHexString();
function cv(w,h,draw,s=2){const c=document.createElement('canvas');c.width=w*s;c.height=h*s;const g=c.getContext('2d');g.scale(s,s);draw(g,w,h);return c}
function tex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function plane(c,worldW,o={}){return new THREE.Mesh(new THREE.PlaneGeometry(worldW,worldW*c.height/c.width),new THREE.MeshBasicMaterial({map:tex(c),transparent:true,side:THREE.DoubleSide,depthWrite:false,...o}))}
function textPlane(str,{size=40,weight=800,color=P.ink,ls=0,align='center',worldH=.2,pad=6}={}){
  const m=document.createElement('canvas').getContext('2d');m.font=`${weight} ${size}px Montserrat`;m.letterSpacing=ls+'px';
  const w=Math.ceil(m.measureText(str).width)+pad*2,h=Math.ceil(size*1.3);
  const c=cv(w,h,g=>{g.font=`${weight} ${size}px Montserrat`;g.letterSpacing=ls+'px';g.fillStyle=color;g.textBaseline='middle';g.fillText(str,pad,h/2+size*.04)});
  const mesh=plane(c,worldH*w/h);mesh.userData.w=worldH*w/h;
  if(align!=='center')mesh.geometry.translate(align==='right'?-mesh.userData.w/2:mesh.userData.w/2,0,0);
  return mesh}
const front=(m,ro=50)=>{m.material.depthTest=false;m.renderOrder=ro;return m};
function dom(cls,html=''){const e=document.createElement('div');e.className=cls;e.innerHTML=html;ui.appendChild(e);return e}
const _v=new THREE.Vector3();
function proj(x,y,z){_v.set(x,y,z).project(cam);return [(_v.x*.5+.5)*W,(-_v.y*.5+.5)*H]}
// camera distance and look height that put world y=yTop at css cssTop and y=yBot at css cssBot
function fit(yTop,yBot,cssTop,cssBot){const ppu=(cssBot-cssTop)/(yTop-yBot),d=(H/ppu)/(2*Math.tan(17.5*Math.PI/180));return {d,ly:yTop-(H/2-cssTop)/ppu,ppu}}

// ---------- backdrop: pastel skyline + clouds (parallax as the camera travels) ----------
const clouds=[],sky=[];
function buildBackdrop(x1){
  const r=rng(11),cols=[P.cream2,P.cream3,P.sky3,P.lav3,'#DCE8F5','#EDE3F3',P.cream2];
  for(let x=-18;x<x1-6;){const w=.9+r()*1.0,h=.6+r()*1.5,z=-12-r()*4,col=tint(cols[Math.floor(r()*cols.length)],.3);
    const c=cv(48,Math.round(48*h/w),(g,cw,ch)=>{g.fillStyle=col;rr(g,0,0,cw,ch+8,5);g.fill();g.fillStyle='rgba(255,253,248,.72)';
      for(let yy=9;yy<ch-6;yy+=11)for(let xx=8;xx<cw-12;xx+=17)if(r()>.25){rr(g,xx,yy,11,4,2);g.fill()}},1);
    const m=plane(c,w,{depthWrite:true});m.position.set(x+w/2,h/2,z);scene.add(m);sky.push(m);x+=w*(.75+r()*.35)}
  const ct=tex(cv(200,90,g=>{g.fillStyle='rgba(255,253,248,.95)';[[60,58,34],[100,44,40],[140,58,32]].forEach(([x,y,q])=>{g.beginPath();g.arc(x,y,q,0,7);g.fill()});rr(g,30,56,140,34,17);g.fill()}));
  for(let x=-18,i=0;x<x1+14;x+=7.4,i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,.45),new THREE.MeshBasicMaterial({map:ct,transparent:true,depthWrite:false}));
    const s=2.2+r()*2.4;m.scale.set(s,s,1);m.position.set(x+r()*3,6.1+r()*3.6,-15-r()*4);m.userData.x0=m.position.x;m.userData.v=.05+r()*.08;clouds.push(m);scene.add(m)}
}

// ---------- real-chart ribbon ----------
function ribbon(pts,{color,fill,r=.055,baseY=0,solid=true,shadow=true}){
  const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.15),SEG=Math.min(600,Math.max(24,(pts.length-1)*4)),RAD=10;
  const g=new THREE.Group();
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,SEG,r,RAD,false),matte(color,{roughness:.6}));tube.castShadow=shadow;
  const sp=curve.getSpacedPoints(SEG),pos=[],idx=[];
  sp.forEach((p,i)=>{pos.push(p.x,p.y,p.z,p.x,baseY,p.z);if(i<SEG){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}});
  const cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));cg.setIndex(idx);
  const curt=new THREE.Mesh(cg,flat(fill||tint(color),solid?{side:THREE.DoubleSide}:{transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false}));
  const head=new THREE.Mesh(new THREE.SphereGeometry(r*2.3,24,16),matte(color,{roughness:.5}));
  const halo=new THREE.Mesh(new THREE.RingGeometry(r*2.9,r*3.8,40),flat(color,{transparent:true,opacity:.45,side:THREE.DoubleSide,depthWrite:false}));
  g.add(curt,tube,head,halo);
  return {g,curve,head,hp:new THREE.Vector3(),set(p,t=0){p=cl(p);const k=Math.round(p*SEG);tube.geometry.setDrawRange(0,k*RAD*6);cg.setDrawRange(0,k*6);
    this.hp.copy(curve.getPointAt(cl(k/SEG)));head.position.copy(this.hp);halo.position.copy(this.hp);halo.scale.setScalar(1+.25*Math.sin(t*9));halo.quaternion.copy(cam.quaternion);return this.hp}}
}
function dashes(x0,x1,y,z,color){const g=new THREE.Group(),m=flat(color);for(let x=x0;x<x1;x+=.2){const d=new THREE.Mesh(new THREE.BoxGeometry(.11,.024,.024),m);d.position.set(x+.055,y,z);g.add(d)}g.userData.m=m;return g}
const TL=[[0,'9:30'],[.5,'NOON'],[1,'4:00']];
// one chart box: series [{pts, base, i0?, col?, fill?, tag?, t0, dur}] drawn between world yBot..yTop
function chart(g,cfg){
  const {x0=-1.95,x1=1.8,yBot,yTop,series}=cfg,N=cfg.N||Math.max(...series.map(s=>(s.i0||0)+s.pts.length));
  const vals=series.map(s=>s.pts.map(p=>(p/s.base-1)*100*(s.k||1))),all=vals.flat();
  let lo=Math.min(0,...all),hi=Math.max(0,...all);const m=(hi-lo)*.06||.5;if(lo<0)lo-=m;if(hi>0)hi+=m;
  const Xf=i=>lerp(x0,x1,N>1?i/(N-1):0),Y=v=>yBot+(v-lo)/(hi-lo)*(yTop-yBot),zy=Y(0),n=series.length;
  // biggest move at the back so every line stays visible over the solid fills
  const order=series.map((s,j)=>j).sort((a,b)=>Math.abs(vals[b].at(-1))-Math.abs(vals[a].at(-1))),zOf=j=>n>1?lerp(-.5,.5,order.indexOf(j)/(n-1)):0;
  const zF=(n>1?.5:0)+.07;
  const rbs=series.map((s,j)=>{const up=vals[j].at(-1)>=0,color=s.col||(up?P.mint2:P.coral2),fill=s.fill||(up?P.mint3:P.coral3);
    const pts=vals[j].map((v,i)=>new THREE.Vector3(Xf((s.i0||0)+i),Y(v),zOf(j)));
    const rb=ribbon(pts,{color,fill,baseY:zy,r:cfg.r||.055,shadow:n===1});g.add(rb.g);rb.color=color;rb.s=s;rb.n=vals[j].length;
    if(cfg.dots&&rb.n<=12)rb.dots=pts.map(p=>{const d=new THREE.Mesh(new THREE.SphereGeometry(.085,20,14),matte(P.white,{roughness:.5}));d.position.copy(p);d.position.z+=.02;g.add(d);return d});
    return rb});
  if(cfg.grid!==false){const step=(hi-lo)>12?5:(hi-lo)>6?2:(hi-lo)>2.4?1:.5;for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){if(Math.abs(v)<1e-6)continue;
    const gl=new THREE.Mesh(new THREE.BoxGeometry(x1-x0+.3,.012,.012),flat(P.cream3));gl.position.set((x0+x1)/2,Y(v),-.6);g.add(gl);
    const l=front(textPlane((v>0?'+':'−')+Math.abs(v)+'%',{size:26,weight:800,color:P.ink3,ls:1,worldH:.125,align:'left'}));l.position.set(x0+.02,Y(v)+.1,zF);g.add(l)}}
  const dz=dashes(x0-.15,x1+.35,zy,zF,P.ink2);g.add(dz);
  if(cfg.zlabel){const yl=front(textPlane(cfg.zlabel,{size:26,weight:800,color:P.ink3,ls:3,worldH:.12,align:cfg.zalign||'left'}));const low=cfg.zbelow!==false&&zy-yBot<.3&&(cfg.timeLabels||[]).length;yl.position.set(cfg.zalign==='right'?x1+.25:x0+.02,low?yBot-.35:zy+(cfg.zbelow===false?.15:-.16),zF);g.add(yl)}
  (cfg.timeLabels||[]).forEach(([f,s])=>{const l=textPlane(String(s),{size:26,weight:800,color:P.ink3,ls:3,worldH:.12});l.position.set(lerp(x0,x1,f),yBot-.17,zF);g.add(l)});
  if(cfg.title){const l=front(textPlane(cfg.title,{size:30,weight:900,color:P.ink2,ls:3,worldH:.15,align:'left'}));l.position.set(x0+.02,yTop+.2,zF);g.add(l)}
  return {rbs,zy,zF,upd(t){rbs.forEach(rb=>{const s=rb.s,k=(s.pre||0)+(1-(s.pre||0))*eio(pr(t,s.t0,s.t0+(s.dur||1.6)));rb.g.visible=t>=s.t0-.02;rb.set(k,t);
      if(rb.dots)rb.dots.forEach((d,i)=>d.scale.setScalar(back(pr(k,i/(rb.n-1)-.02,i/(rb.n-1)+.06),2)||.0001))});
    if(cfg.zpulse!=null){const k=pr(t,cfg.zpulse,cfg.zpulse+1.6);dz.userData.m.color.set(k>0&&k<1?P.butter2:P.ink2);dz.scale.y=k>0&&k<1?1+1.5*Math.abs(Math.sin(k*Math.PI*4)):1}}}
}

// ---------- shared DOM pieces ----------
const ACR={'s&p':'S&P','ai':'AI','us':'US','u.s.':'U.S.','gop':'GOP','faa':'FAA','ceo':'CEO','fed':'Fed','dow':'Dow','nasdaq':'Nasdaq','etf':'ETF','gdp':'GDP','cpi':'CPI','ppi':'PPI','amd':'AMD','nvidia':'Nvidia','wall':'Wall','street':'Street'};
function nice(s){s=String(s||'');if(s!==s.toUpperCase())return s;const out=s.toLowerCase().split(' ').map(w=>ACR[w]||w).join(' ');return out.charAt(0).toUpperCase()+out.slice(1)}
function titleEl(text,mood){if(!text)return null;const ws=nice(text).split(' ').filter(Boolean),n=ws.join(' ').length;
  const e=dom('c ft'+(n>26?' s':n>15?' m':'')+(mood==='red'?' red':''),ws.map((w,i)=>`<span class="w">${i===ws.length-1?'<em>'+esc(w)+'.</em>':esc(w)+' '}</span>`).join(''));return e}
function show(el,o,tr=''){el.style.opacity=o;el.style.transform=tr}
function words(el,t,tin,tout,{step=.075,times=null,dy=26,outDy=-16}={}){
  const sp=el._sp||(el._sp=[...el.querySelectorAll('.w')]);
