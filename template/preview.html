<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viridian live preview</title>
<style>
:root{--bg:#23262f;--panel:#2d313c;--ink:#f1ece2;--mut:#9aa3b5;--acc:#8FD3B6;--coral:#E07A6B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;display:flex;gap:20px;padding:16px;min-height:100vh;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#phone{position:relative;width:360px;height:640px;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);flex:none}
#phone iframe{position:absolute;left:0;top:0;width:540px;height:960px;border:0;transform:scale(.6667);transform-origin:0 0}
#guides{position:absolute;inset:0;pointer-events:none;display:none}
#guides.on{display:block}
#guides .z{position:absolute;left:0;right:0;background:rgba(224,122,107,.28);border-top:1px dashed #fff;border-bottom:1px dashed #fff}
#guides span{position:absolute;right:6px;font-size:9px;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:6px}
#side{width:340px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:14px;padding:12px 14px}
h1{font-size:15px;letter-spacing:.3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#3b4050;color:var(--ink);border:0;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{background:#4a5066}button.on{background:var(--acc);color:#1d2a24}
#play{background:var(--acc);color:#1d2a24;font-weight:700;min-width:84px}
input[type=range]{width:100%}
#scenes{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.sc{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;background:#363b49;cursor:pointer;font-size:13px}
.sc.cur{outline:2px solid var(--acc)}.sc small{color:var(--mut)}
#time{font-variant-numeric:tabular-nums;color:var(--mut)}
#msg{color:var(--coral);font-size:12px;min-height:16px}
#cur{color:var(--mut);font-size:13px;min-height:54px}
kbd{background:#3b4050;border-radius:5px;padding:0 5px;font-size:11px}
</style></head><body>
<div id="phone"><iframe id="f" title="scene"></iframe>
  <div id="guides"><div class="z" style="top:0;height:13%"><span>app bar</span></div><div class="z" style="top:81.8%;bottom:0"><span>app buttons</span></div></div></div>
<div id="side">
  <div class="card"><h1 id="title">Viridian live preview</h1><div id="msg"></div></div>
  <div class="card">
    <div class="row"><button id="play">Play</button><button id="back">-1s</button><button id="fwd">+1s</button><button id="sg">Safe zone</button><button id="cap" class="on">Captions</button></div>
    <input type="range" id="seek" min="0" max="1" step="0.01" value="0" style="margin-top:10px">
    <div class="row" style="justify-content:space-between"><span id="time">0.0 / 0.0 s</span><label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option></select></label></div>
    <div id="cur"></div>
  </div>
  <div class="card"><div style="margin-bottom:6px;color:var(--mut)">Scenes (click to jump)</div><div id="scenes"></div></div>
  <div class="card" style="color:var(--mut);font-size:12px"><kbd>Space</kbd> play/pause &nbsp; <kbd>←</kbd><kbd>→</kbd> 1 s &nbsp; <kbd>S</kbd> safe zone &nbsp; <kbd>C</kbd> captions<br>Edit script.json, timing.json or a flat*.html and this page reloads and keeps your place.</div>
</div>
<audio id="a" preload="auto"></audio><audio id="m" preload="auto"></audio><audio id="x" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id);
const f=$('f'),A=$('a'),Mu=$('m'),Sx=$('x');
let info,script,timing,t=0,playing=false,ready=false,caps=true,lastMt=0,raf=0,clock=0,clockAt=0,hasAudio=false;
const fmt=s=>s.toFixed(1);
const say=m=>$('msg').textContent=m||'';
async function load(keepT){
  ready=false;say('');
  try{
    info=await (await fetch('/api/info',{cache:'no-store'})).json();lastMt=info.mtime;
    [script,timing]=await Promise.all([fetch('/day/script.json',{cache:'no-store'}).then(r=>r.json()),fetch('/day/timing.json',{cache:'no-store'}).then(r=>r.json())]);
  }catch(e){say('Waiting for script.json and timing.json ('+e.message+')');return}
  $('title').textContent='Day '+info.day+'  ·  '+info.scene;
  hasAudio=info.hasVoice;
  if(hasAudio){const q='?v='+Math.round(info.mtime);A.src='/day/voice.wav'+q;if(info.hasMusic){Mu.src='/day/music.wav'+q;Mu.volume=.22}if(info.hasSfx){Sx.src='/day/sfx.wav'+q;Sx.volume=.9}}
  $('seek').max=timing.duration;
  $('scenes').innerHTML=timing.scenes.map((s,i)=>`<div class="sc" data-t="${(s.t0+.3).toFixed(2)}"><span>${i+1}. ${s.id}</span><small>${s.t0.toFixed(1)}s</small></div>`).join('');
  [...document.querySelectorAll('.sc')].forEach(el=>el.onclick=()=>seek(Number(el.dataset.t)));
  f.onload=async()=>{try{
      await f.contentWindow.document.fonts.ready;
      await new Promise(r=>{const i=setInterval(()=>{if(typeof f.contentWindow.init==='function'){clearInterval(i);r()}},50)});
      f.contentWindow.init(script,timing,{captions:caps});ready=true;
      if(typeof keepT==='number')seek(keepT);else seek(0);
    }catch(e){say('Scene error: '+e.message)}};
  f.src='/'+info.scene+'?r='+Date.now();
}
function draw(){
  if(!ready)return;
  try{f.contentWindow.render(t)}catch(e){say('Render error: '+e.message);return}
  $('seek').value=t;$('time').textContent=fmt(t)+' / '+fmt(timing.duration)+' s';
  const i=timing.scenes.findIndex(s=>t>=s.t0-.05&&t<s.t1-.05);
  document.querySelectorAll('.sc').forEach((el,k)=>el.classList.toggle('cur',k===i));
  if(i>=0){const sc=script.scenes[i];$('cur').innerHTML='<b>'+sc.id+'</b> · '+(sc.visual&&sc.visual.type||'')+'<br>'+(sc.text||'')}
}
function seek(s){t=Math.max(0,Math.min(timing.duration,s));if(hasAudio){A.currentTime=t;if(info.hasMusic)Mu.currentTime=t;if(info.hasSfx)Sx.currentTime=t}clock=t;clockAt=performance.now();draw()}
function setPlay(p){playing=p;$('play').textContent=p?'Pause':'Play';
  const r=Number($('speed').value);[A,Mu,Sx].forEach(a=>a.playbackRate=r);
  if(p){clock=t;clockAt=performance.now();if(hasAudio){A.currentTime=t;A.play().catch(()=>{});if(info.hasMusic){Mu.currentTime=t;Mu.play().catch(()=>{})}if(info.hasSfx){Sx.currentTime=t;Sx.play().catch(()=>{})}}}
  else{[A,Mu,Sx].forEach(a=>a.pause())}}
function loop(){
  if(playing&&ready){const r=Number($('speed').value);
    t=(hasAudio&&!A.paused&&A.readyState>2)?A.currentTime:clock+(performance.now()-clockAt)/1000*r;
    if(t>=timing.duration){t=timing.duration;setPlay(false)}draw()}
  raf=requestAnimationFrame(loop)}
$('play').onclick=()=>setPlay(!playing);$('back').onclick=()=>seek(t-1);$('fwd').onclick=()=>seek(t+1);
$('seek').oninput=e=>seek(Number(e.target.value));
$('speed').onchange=()=>{if(playing){setPlay(false);setPlay(true)}};
$('sg').onclick=()=>{$('guides').classList.toggle('on');$('sg').classList.toggle('on')};
$('cap').onclick=()=>{caps=!caps;$('cap').classList.toggle('on',caps);try{f.contentDocument.body.classList.toggle('captions',caps)}catch(e){}};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing)}else if(e.key==='ArrowLeft')seek(t-1);else if(e.key==='ArrowRight')seek(t+1);
  else if(e.key==='s'||e.key==='S')$('sg').click();else if(e.key==='c'||e.key==='C')$('cap').click()});
// hot reload: poll file times, reload the scene and keep the place
setInterval(async()=>{try{const i=await (await fetch('/api/info',{cache:'no-store'})).json();
  if(i.mtime!==lastMt){const keep=t,was=playing;setPlay(false);await load(keep);if(was)setTimeout(()=>setPlay(true),300)}}catch(e){}},900);
load();loop();
</script></body></html>
