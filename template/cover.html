<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#F4ECDF;font-family:Montserrat,sans-serif;color:#3E4A63}
svg{position:absolute;left:0;top:0}
.t{position:absolute;left:0;right:0;text-align:center}
.k{top:112px;font-weight:800;font-size:15px;letter-spacing:5px;color:#E07A6B}
.h1{top:140px;font-weight:900;font-size:62px;line-height:1;letter-spacing:-1px}
.h2{top:206px;font-weight:900;font-size:96px;line-height:1;letter-spacing:-2px;color:#E07A6B}
.sub{top:826px;font-weight:700;font-size:15px;letter-spacing:1px;color:#5B6782}
.pill{position:absolute;top:772px;white-space:nowrap;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.pill span{font-weight:800;font-size:12.5px;padding:8px 11px;white-space:nowrap;border-radius:20px;letter-spacing:.5px}
.dn{background:#F9D5CD;color:#C45A4B}.up{background:#CDEEDF;color:#3F9A74}
.ft{bottom:34px;top:auto;font-family:Inter;font-weight:600;font-size:10px;color:#8691A8}
</style></head>
<body>
<svg width="540" height="960" viewBox="0 0 540 960" id="s"></svg>
<div class="t k">MARKET CLOSE · NOV 3, 2026</div>
<div class="t h1">ELECTION DAY</div>
<div class="t h2">SPLIT</div>
<div class="pill"><span class="dn">▼ DOW −0.38%</span><span class="up">▲ S&amp;P +0.36%</span><span class="up">▲ NASDAQ +0.83%</span></div>
<div class="t sub">Chips rally · Apple slips · AMD jumps after hours</div>
<div class="t ft">Entertainment only. Not financial advice.</div>
<script>
const NS='http://www.w3.org/2000/svg';const s=document.getElementById('s');
const P={cream2:'#EADFCD',cream3:'#DFD1BB',ink:'#3E4A63',ink2:'#5B6782',mint:'#8FD3B6',mint2:'#5FB894',coral:'#F19C8E',coral2:'#E07A6B',butter:'#F6D186',butter2:'#E9B65A',sky:'#A7C7EA',sky2:'#7FA8D8',sky3:'#D5E5F6',lav:'#C3B3E6',lav3:'#E6DEF5',white:'#FFFDF8'};
const rr=(x,y,w,h,r,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${e}/>`;
const pa=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const star=(x,y,k)=>`<path transform="translate(${x} ${y}) scale(${k})" d="M0 -14L3.5 -3.5L14 0L3.5 3.5L0 14L-3.5 3.5L-14 0L-3.5 -3.5Z" fill="${P.butter2}"/>`;
let r=(q=>()=>(q=(q*16807)%2147483647)/2147483647)(7);
let h='';
// skyline
[[0,40,90,P.sky3],[34,28,60,P.lav3],[62,44,110,P.cream2],[106,30,70,P.sky3],[136,38,96,P.lav3],[174,32,54,P.cream2],[206,46,126,P.sky3],[252,30,66,P.lav3],[282,40,100,P.cream2],[322,34,60,P.sky3],[356,44,118,P.lav3],[400,32,76,P.cream2],[432,38,92,P.sky3],[470,36,58,P.lav3],[506,40,100,P.cream2]].forEach(([x,w,hh,c])=>{h+=rr(x,740-hh,w,hh,3,c);for(let i=0;i<4;i++)h+=rr(x+6,740-hh+10+i*20,w-12,6,2,P.white,'opacity=".7"');});
h+=`<circle cx="270" cy="480" r="200" fill="${P.cream2}"/>`;
// seesaw: building left, apple right (down)
h+=`<g transform="translate(270 600)">${pa('M-26 46L0 0L26 46Z',P.ink)}${rr(-40,44,80,12,6,P.ink2)}</g>`;
h+=`<g transform="translate(270 600) rotate(11)">${rr(-170,-6,340,12,6,P.ink2)}</g>`;
// building (left, higher)
h+=`<g transform="translate(155 507) scale(.62)">${rr(-135,70,270,16,3,P.sky2)}${rr(-122,56,244,14,3,P.sky)}${rr(-110,44,220,12,3,P.sky2)}${[-84,-56,-28,0,28,56,84].map(x=>rr(x-9,-48,18,92,4,P.white)+rr(x-5,-48,4,92,2,P.sky3)).join('')}${rr(-116,-62,232,16,3,P.sky)}${pa('M-124 -62L0 -118L124 -62Z',P.sky2)}${pa('M-100 -66L0 -108L100 -66Z',P.sky3)}<circle cy="-84" r="11" fill="${P.white}"/><circle cy="-84" r="5" fill="${P.butter2}"/>${rr(-2,-146,4,34,2,P.ink2)}${pa('M2 -146L30 -137L2 -128Z',P.coral)}</g>`;
// apple (right, low)
h+=`<g transform="translate(385 590) scale(1.1)">${pa('M0 -26C-20 -44 -58 -36 -58 4C-58 38 -30 62 -14 58C-7 56 7 56 14 58C30 62 58 38 58 4C58 -36 20 -44 0 -26Z',P.coral)}${pa('M26 -22C48 -14 58 8 52 30C50 38 44 46 38 50C50 28 46 2 26 -22Z',P.coral2,'opacity=".55"')}<path d="M-34 -8C-38 8 -32 24 -23 34" fill="none" stroke="${P.white}" stroke-width="7" stroke-linecap="round" opacity=".6"/>${rr(-3.5,-54,7,26,3.5,P.ink2)}${pa('M5 -44C16 -66 38 -64 42 -58C34 -45 16 -40 5 -44Z',P.mint2)}</g>`;
// bars (rising chart) center-top of disc
[[-60,70,P.coral,P.coral2],[0,110,P.mint,P.mint2],[60,150,P.mint,P.mint2]].forEach(([x,hh,c,c2])=>{h+=`<g transform="translate(${270+x} 440)">${rr(-24,-hh,48,hh,9,c)}${rr(-24,-hh,48,14,7,c2)}${rr(-17,-hh+10,8,Math.max(0,hh-24),4,P.white,'opacity=".35"')}</g>`});

// chip (night/AMD) top right of disc with moon
h+=`<g transform="translate(415 330) scale(.42)">${[-42,-21,0,21,42].map(v=>rr(v-5,-98,10,28,4,P.butter2)+rr(v-5,70,10,28,4,P.butter2)+rr(-98,v-5,28,10,4,P.butter2)+rr(70,v-5,28,10,4,P.butter2)).join('')}${rr(-76,-76,152,152,20,P.butter)}${rr(-52,-52,104,104,12,'#FBEBC5')}${rr(-24,-24,48,48,8,P.white)}${rr(-12,-12,24,24,5,P.butter2)}</g>`;
h+=`<g transform="translate(125 330)"><circle r="30" fill="${P.butter}"/><circle cx="14" cy="-9" r="27" fill="${P.cream2}"/></g>`;
[[90,250,1],[450,250,.8],[60,420,.7],[480,470,.9],[270,262,.6]].forEach(([x,y,k])=>h+=star(x,y,k));
// confetti
for(let i=0;i<26;i++){const x=20+r()*500,y=22+r()*66;const c=[P.coral,P.mint,P.butter,P.sky,P.lav][i%5];h+=i%3?`<rect x="${x}" y="${y}" width="9" height="16" rx="3" fill="${c}" transform="rotate(${r()*180} ${x} ${y})" opacity=".8"/>`:`<circle cx="${x}" cy="${y}" r="5" fill="${c}" opacity=".8"/>`;}
// logo badge bottom center
h+=`<clipPath id="lc"><circle r="62"/></clipPath><g transform="translate(270 688)"><circle r="68" fill="${P.white}"/><image href="assets/vc-logo.png" x="-64" y="-64" width="128" height="128" clip-path="url(#lc)"/></g>`;
s.innerHTML=h;
window.__ready=true;
</script></body></html>
